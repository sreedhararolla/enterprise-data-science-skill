name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9",  pandas: "pandas>=2.0,<2.3" }
          - { os: ubuntu-latest,  python: "3.11", pandas: "pandas>=2.2,<3" }
          - { os: ubuntu-latest,  python: "3.12", pandas: "pandas>=3,<4" }
          - { os: ubuntu-latest,  python: "3.13", pandas: "pandas>=3,<4" }
          - { os: windows-latest, python: "3.12", pandas: "pandas>=3,<4" }
          - { os: macos-latest,   python: "3.12", pandas: "pandas>=2.2,<3" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.pandas }}" numpy scipy pyarrow pytest pyyaml scikit-learn
      - name: Versions
        run: python -c "import sys, pandas, numpy, scipy; print(sys.version, pandas.__version__, numpy.__version__, scipy.__version__)"
      - name: Test
        env:
          OMP_NUM_THREADS: "1"
          PYTHONWARNINGS: ignore
        run: python -m pytest -q tests
